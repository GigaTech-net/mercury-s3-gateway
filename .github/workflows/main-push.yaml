---
name: main push workflow

on:
  workflow_call:
  push:
    branches:
      - master

permissions:
  actions: read
  checks: read
  contents: write
  deployments: read
  issues: read
  discussions: read
  packages: read
  pages: read
  pull-requests: write
  repository-projects: read
  security-events: read
  statuses: write  

# cancel any previously-started, yet still active runs of this workflow on the same branch
concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    permissions: read-all
    # rw-setup.yaml published these six as WORKFLOW outputs. A composite action
    # only yields STEP outputs, so they are re-declared here at job level --
    # without this block every needs.setup.outputs.* reference silently
    # resolves to the empty string.
    outputs:
      current-version: ${{ steps.setup.outputs.current-version }}
      current-v-version: ${{ steps.setup.outputs.current-v-version }}
      version: ${{ steps.setup.outputs.version }}
      v-version: ${{ steps.setup.outputs.v-version }}
      pre-release-label: ${{ steps.setup.outputs.pre-release-label }}
      branch: ${{ steps.setup.outputs.branch }}
    steps:
      # The action does not check out; version detection reads git tags, so the
      # full history has to be on disk first.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup workflow environment
        id: setup
        uses: >-
          GigaTech-net/public-reusable-workflows/.github/actions/setup-workflow@v1

  lint:
    name: Lint Code Base
    needs: [setup]
    permissions:
      contents: read
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full git history is needed to get a proper list of changed files
          fetch-depth: 0

      - name: Super linter
        uses: GigaTech-net/public-reusable-workflows/.github/actions/super-linter@v1
        with:
          env_file_path: .github/super-linter-push.env

  secret-scan:
    name: Secret Scan
    needs: [setup]
    runs-on: ubuntu-latest
    permissions: read-all
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # No inputs: the action's defaults (path ./, base "", head
      # github.ref_name, extra_args --debug --json --only-verified) are exactly
      # the values rw-secret-scan.yaml hardcoded.
      - name: Secret scan
        uses: >-
          GigaTech-net/public-reusable-workflows/.github/actions/secret-scan@v1

  spellcheck:
    name: Spellcheck codebase
    needs: [setup]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # github_token is a new REQUIRED input. rw-spellcheck.yaml read
      # secrets.GITHUB_TOKEN directly; a composite action cannot, so the caller
      # passes it. It is used only to push spelling corrections back to the
      # branch, which is why this job keeps contents: write.
      - name: Spellcheck
        uses: GigaTech-net/public-reusable-workflows/.github/actions/spellcheck@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  tag:
    needs: [setup, lint, secret-scan, spellcheck]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full git history is needed to get a proper list of changed files within `super-linter`
          fetch-depth: 0

      - name: Setup GitHub token
        uses: GigaTech-net/public-reusable-workflows/.github/actions/setup-token@v1
        with:
          app_id: ${{ secrets.KEYROTATION_APPID_GT_GH }}
          private_key: ${{ secrets.KEYROTATION_PVTKEY_GT_GH }}

      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@1.70.0 # Don't use @main or @v1 unless you're happy to test the latest version
        env:
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
          WITH_V: true
          PRERELEASE: true